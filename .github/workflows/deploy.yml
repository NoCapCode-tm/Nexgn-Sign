name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push waits instead of cancelling a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Guard against a stray public/index.html
        run: |
          if [ -f public/index.html ]; then
            echo "::error file=public/index.html::Delete public/index.html. Vite copies it into dist and overwrites the built page."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs: vite build, then scripts/postbuild.mjs (404.html + prerendered public routes)
      - name: Build
        run: npm run build

      - name: Verify the build output
        run: |
          for f in dist/index.html dist/404.html dist/CNAME dist/login/index.html; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done
          grep -qx "sign.nexgn.cloud" dist/CNAME || { echo "::error::dist/CNAME must contain sign.nexgn.cloud"; exit 1; }
          grep -q "/assets/" dist/index.html || { echo "::error::dist/index.html is not the built page"; exit 1; }
          echo "Build output looks good"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4